apiVersion: 1

datasources:
  - name: JobMarketPostgres
    type: postgres
    access: proxy
    url: postgres:5432
    user: hive
    secureJsonData:
      password: hivepassword
    jsonData:
      database: metastore
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
    isDefault: true
    editable: true
